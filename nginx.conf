# ==============================================================================
#  Tasf.B2B — Configuración de Nginx para Producción
#  Archivo de referencia: copiar el bloque "server" a
#  /etc/nginx/sites-available/default en la VM Ubuntu.
# ==============================================================================
#
#  Arquitectura:
#  ┌─────────────┐   Puerto 80   ┌───────────────────────────┐
#  │  Navegador  │ ────────────► │  Nginx (puerto 80)        │
#  └─────────────┘               │  ├─ /        → dist/      │
#                                │  └─ /api/*   → :8080      │
#                                └───────────────────────────┘
#                                              │ loopback
#                                ┌─────────────▼─────────────┐
#                                │  Backend Spring Boot :8080 │
#                                └───────────────────────────┘
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # ── Dominio / nombre del servidor ─────────────────────────────────────────
    # Reemplaza con tu dominio real o IP pública de la VM.
    # Ejemplos: server_name tasf.universidad.edu; | server_name 192.168.1.100;
    server_name _;

    # ── Archivos estáticos de Angular ─────────────────────────────────────────
    # Apunta a la carpeta de salida del build de producción.
    # Ejecutar primero: ng build --configuration production
    # El nombre del subdirectorio interior puede variar; ajusta si es necesario.
    root /var/www/tasf-b2b/dist/frontend-plantilla/browser;
    index index.html;

    # Codificación y tipos MIME
    charset utf-8;

    # ── Enrutamiento de Angular (SPA) ─────────────────────────────────────────
    # try_files garantiza que al recargar cualquier ruta Angular
    # (ej. /vuelos/123) no devuelva un 404, sino que sirva index.html
    # y deje que el router de Angular maneje la navegación.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy Reverso hacia el Backend (/api/) ────────────────────────────────
    # TODO el tráfico con prefijo /api/ es redirigido internamente
    # al backend en el puerto 8080 (nunca expuesto al exterior).
    #
    # Ejemplo de flujo:
    #   GET /api/vuelos  →  Nginx  →  http://127.0.0.1:8080/api/vuelos
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;

        # Cabeceras esenciales para que el backend conozca el cliente real
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts razonables para una VM con 2 GB de RAM
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Deshabilitar buffering para respuestas de streaming / SSE
        proxy_buffering    off;
    }

    # ── Caché de assets estáticos ─────────────────────────────────────────────
    # Los archivos con hash de Angular (*.js, *.css) son inmutables;
    # se pueden cachear agresivamente en el navegador.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Seguridad básica ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;

    # Ocultar versión de Nginx en cabeceras de error
    server_tokens off;

    # ── Compresión gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 256;
}
