# ==============================================================================
#  Frontend Angular — Nginx para contenedor Docker / Dokploy
#
#  Arquitectura:
#  ┌─────────────┐   Puerto 80   ┌───────────────────────────────────────────┐
#  │  Navegador  │ ────────────► │  Contenedor Nginx (puerto 80)             │
#  └─────────────┘               │  ├─ /          → /usr/share/nginx/html    │
#                                │  └─ /api/*     → http://backend:3000      │
#                                └───────────────────────────────────────────┘
#
#  En Dokploy el backend corre en su propio servicio. Ajusta la variable
#  BACKEND_URL o reemplaza la dirección directamente en la sección proxy.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Archivos estáticos de Angular ─────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ── Enrutamiento SPA (Angular Router) ─────────────────────────────────────
    # Garantiza que al recargar cualquier ruta Angular no devuelva 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy Reverso hacia el Backend (/api/) ────────────────────────────────
    # En Dokploy los servicios se comunican por nombre de servicio interno.
    # Reemplaza "backend" por el nombre exacto de tu servicio backend en Dokploy.
    location /api/ {
        proxy_pass         http://backend:3000/api/;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        proxy_buffering    off;
    }

    # ── Caché de assets estáticos (hashed por Angular) ────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cabeceras de seguridad ────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    server_tokens off;

    # ── Compresión gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 256;
}
