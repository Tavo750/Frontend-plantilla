# ==============================================================================
#  Frontend Angular — Nginx para contenedor Docker / Dokploy
#
#  Arquitectura en Dokploy:
#  ┌─────────────┐   Puerto 80   ┌────────────────────────────────────────────┐
#  │  Navegador  │ ────────────► │  Contenedor Nginx (puerto 80)              │
#  └─────────────┘               │  Sirve: /usr/share/nginx/html (dist/)      │
#         │                      └────────────────────────────────────────────┘
#         │  HTTP directo (CORS)
#         ▼
#  ┌──────────────────────────────────────────────────────────────────────────┐
#  │  Backend Dokploy                                                         │
#  │  backend7g-tasfb2bbackend-fvm1gb-41d9b0-200-16-7-153.sslip.io           │
#  └──────────────────────────────────────────────────────────────────────────┘
#
#  Nota: el browser llama al backend directamente por su dominio público.
#  Nginx solo sirve los assets estáticos del SPA de Angular.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Archivos estáticos de Angular ─────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ── Enrutamiento SPA (Angular Router) ─────────────────────────────────────
    # Garantiza que al recargar cualquier ruta de Angular (ej. /dashboard/123)
    # no devuelva un 404: siempre se sirve index.html y Angular toma el control.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caché agresiva para assets con hash de Angular ────────────────────────
    # Los archivos *.js y *.css generados por Angular incluyen hash en el nombre;
    # son inmutables y se pueden cachear durante 1 año en el navegador.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cabeceras de seguridad ────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    server_tokens off;

    # ── Compresión gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;
    gzip_min_length 256;
}
